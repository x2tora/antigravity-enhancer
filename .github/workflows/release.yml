name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify enhancer manifest and E2E suite (pre-build)
        shell: pwsh
        run: |
          node .\generate_enhancer_manifest.js

      - name: Build Windows installer and checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "3.0.0" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build_exe_installer.ps1 -Version $ver

      - name: Run v3 architecture E2E suite
        shell: pwsh
        run: |
          node .\tests\e2e\runner.js --feature=F22,F23,F24,F25 --summary -NoKill

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-enhancer-win
          path: |
            Antigravity-Enhancer-Setup.exe
            Antigravity-Enhancer-v*-Setup.exe
            AntigravityEnhancerLauncher.exe
            Antigravity-Enhancer-v*-Win.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Antigravity-Enhancer-Setup.exe
            Antigravity-Enhancer-v*-Setup.exe
            AntigravityEnhancerLauncher.exe
            Antigravity-Enhancer-v*-Win.zip
            SHA256SUMS.txt
