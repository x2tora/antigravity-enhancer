name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify enhancer manifest and E2E suite (pre-build)
        shell: pwsh
        run: |
          node .\generate_enhancer_manifest.js

      - name: Build Windows & Unix packages and checksums
        shell: pwsh
        run: |
          $pkgVer = (Get-Content .\package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^v(\d+\.\d+\.\d+(?:\.\d+)?)$') { $Matches[1] } else { $pkgVer }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build_exe_installer.ps1 -Version $ver
          tar -czf "Antigravity-Enhancer-v$ver-Unix.tar.gz" install.sh installer/install.mjs enhancer README.md CHANGELOG.md
          $unixHash = (Get-FileHash -Path "Antigravity-Enhancer-v$ver-Unix.tar.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -Path .\SHA256SUMS.txt -Value "$unixHash  Antigravity-Enhancer-v$ver-Unix.tar.gz" -Encoding UTF8

      - name: Run full E2E verification suite
        shell: pwsh
        run: |
          node .\tests\e2e\runner.js --summary -NoKill

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: antigravity-enhancer-packages
          path: |
            Antigravity-Enhancer-Setup.exe
            Antigravity-Enhancer-v*-Setup.exe
            Antigravity-Enhancer-v*-Win.zip
            Antigravity-Enhancer-v*-Unix.tar.gz
            SHA256SUMS.txt

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            Antigravity-Enhancer-Setup.exe
            Antigravity-Enhancer-v*-Setup.exe
            Antigravity-Enhancer-v*-Win.zip
            Antigravity-Enhancer-v*-Unix.tar.gz
            SHA256SUMS.txt

      - name: Notify Discord on version release
        if: startsWith(github.ref, 'refs/tags/v') && env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $manifest = Get-Content .\enhancer\manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $notes = if ($manifest.releaseNotesI18n -and $manifest.releaseNotesI18n.ko) { $manifest.releaseNotesI18n.ko } else { $manifest.releaseNotes }
          if ($notes.Length -gt 600) { $notes = $notes.Substring(0, 597) + "..." }
          $releaseUrl = "https://github.com/x2tora/antigravity-enhancer/releases/tag/$($env:TAG_NAME)"
          $siteUrl = "https://antigravity.xitora.cc"
          $avatarUrl = "https://raw.githubusercontent.com/x2tora/antigravity-enhancer/main/assets/icon.png"
          $payload = @{
            username = "AntigravityEnhancer"
            avatar_url = $avatarUrl
            embeds = @(
              @{
                title = "Antigravity Enhancer $($env:TAG_NAME) 업데이트"
                url = $siteUrl
                description = "**지원 Antigravity 버전:** ``$($manifest.testedAppVersion)```n`n$notes"
                color = 10527734
              }
            )
            components = @(
              @{
                type = 1
                components = @(
                  @{
                    type = 2
                    style = 5
                    label = "릴리스 다운로드"
                    url = $releaseUrl
                  }
                )
              }
            )
          } | ConvertTo-Json -Depth 6
          $webhookUri = $env:DISCORD_WEBHOOK_URL
          if ($webhookUri -notmatch 'with_components=') {
            $sep = if ($webhookUri -match '\?') { '&' } else { '?' }
            $webhookUri = "$webhookUri${sep}with_components=true"
          }
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
          Invoke-RestMethod -Uri $webhookUri -Method Post -ContentType "application/json; charset=utf-8" -Body $bytes | Out-Null
